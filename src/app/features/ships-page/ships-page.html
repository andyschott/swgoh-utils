<main class="ships-layout">
  <section class="ships-card" aria-labelledby="ships-title">
    <h1 id="ships-title">Ships</h1>

    <div class="search-control">
      <input
        id="ships-search"
        type="search"
        aria-label="Search ships"
        placeholder="Type a ship name"
        [value]="searchTerm()"
        (input)="onSearchInput($event)"
      />
    </div>

    <div class="table-container">
      <table>
        <caption class="visually-hidden">
          All ships in the game with earnable locations
        </caption>
        <thead>
          <tr>
            <th scope="col">Ship</th>
            <th scope="col">Locations</th>
          </tr>
        </thead>
        <tbody>
          @for (row of filteredRows(); track row.id) {
            <tr>
              <th scope="row">{{ row.name }}</th>
              <td>{{ row.locations | earnableLocations }}</td>
            </tr>
          } @empty {
            <tr>
              <td colspan="2">No ships match the current search.</td>
            </tr>
          }
        </tbody>
      </table>
    </div>
  </section>
</main>
