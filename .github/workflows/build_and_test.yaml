name: Build and Test

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  api:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '10.0.x'
      - name: Build
        run: dotnet build --configuration Release
        working-directory: ./api
      - name: Test
        run: dotnet test --configuration Release
        working-directory: ./api
